name: Build App images

on:
  push:
    branches: [main]
    paths:
      - "royal-price-dashboard/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "royal-price-dashboard/**"
      - ".github/workflows/build.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  APP_DIR: royal-price-dashboard
  ARCHITECTURES: '["amd64", "aarch64"]'
  BUILDX_METADATA_PROVENANCE: "false"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  IMAGE_NAME: royal-price-dashboard
  REGISTRY_PREFIX: ghcr.io/mycroftholmesv

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(awk -F '"' '/^version:/ { print $2; exit }' "${APP_DIR}/config.yaml")"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "config.yaml contains an invalid version: ${version}" >&2
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "release" && "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "Release tag ${RELEASE_TAG} must equal v${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare native architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  verify:
    name: Verify release source
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: royal-price-dashboard
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run backend and repository tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile server.py upstream_adapter.py tests/test_server.py

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check frontend syntax
        run: node --check static/app.js

  build:
    name: Check ${{ matrix.arch }} build
    needs: prepare
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image without publishing
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ env.APP_DIR }}
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=Royal Price Dashboard
            io.hass.description=Public Royal Caribbean and Celebrity sailing price dashboard
            io.hass.url=https://github.com/MycroftHolmesV/RoyalPriceDashboard/tree/main/royal-price-dashboard
            org.opencontainers.image.source=https://github.com/MycroftHolmesV/RoyalPriceDashboard
            org.opencontainers.image.licenses=MIT
          push: false
          version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish ${{ matrix.arch }}
    needs: [prepare, verify]
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, sign, and publish image
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./${{ env.APP_DIR }}
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=Royal Price Dashboard
            io.hass.description=Public Royal Caribbean and Celebrity sailing price dashboard
            io.hass.url=https://github.com/MycroftHolmesV/RoyalPriceDashboard/tree/main/royal-price-dashboard
            org.opencontainers.image.source=https://github.com/MycroftHolmesV/RoyalPriceDashboard
            org.opencontainers.image.licenses=MIT
          push: true
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    needs: [prepare, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish signed manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: ${{ needs.prepare.outputs.version }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
