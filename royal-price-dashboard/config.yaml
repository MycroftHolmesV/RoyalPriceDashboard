name: Royal Price Dashboard
version: "0.6.0"
slug: royal_price_dashboard
description: Browse current and historical Royal Caribbean and Celebrity prices across multiple cruises.
url: https://github.com/MycroftHolmesV/RoyalPriceDashboard/tree/main/royal-price-dashboard
arch:
  - aarch64
  - amd64
image: ghcr.io/mycroftholmesv/royal-price-dashboard
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:ship-wheel
panel_title: Royal Prices
panel_admin: false
homeassistant_api: true
watchdog: http://[HOST]:[PORT:8099]/health
backup: cold
stage: experimental
options:
  notifications_enabled: true
schema:
  ship: str?
  sail_date: "match(^\\d{4}-\\d{2}-\\d{2}$)?"
  currency: "match(^[A-Za-z]{3}$)?"
  watched_refresh_interval_hours: "int(1,168)?"
  unwatched_refresh_interval_hours: "int(1,168)?"
  refresh_interval_hours: "int(1,168)?"
  notifications_enabled: bool
